name: release

on:
  push:
    tags:
      - "v*"

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.27.4"
      - run: env -u XPOST_X_CLIENT_ID -u XPOST_X_CLIENT_SECRET go test ./...
      - run: scripts/build-release.sh "$GITHUB_REF_NAME" dist
      - run: cd dist && sha256sum -c SHA256SUMS
      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          assets=(
            dist/xpost-linux-amd64
            dist/xpost-linux-arm64
            dist/xpost-darwin-amd64
            dist/xpost-darwin-arm64
            dist/xpost.env.example
            dist/bootstrap.sh
            dist/INSTALL.md
            dist/SHA256SUMS
          )
          gh release create "$GITHUB_REF_NAME" \
            --verify-tag \
            --title "$GITHUB_REF_NAME" \
            --notes "Prebuilt CGO_ENABLED=0 binaries for linux and darwin (amd64, arm64), plus bootstrap.sh, xpost.env.example and INSTALL.md. Verify with: sha256sum -c SHA256SUMS" \
            "${assets[@]}"
