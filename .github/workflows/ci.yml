name: ci
on:
  push:
    branches: [main, "cursor/**"]
  pull_request:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: gofmt
        run: test -z "$(gofmt -l .)" || (gofmt -l . && exit 1)
      - name: vet
        run: go vet ./...
      - name: test
        run: go test -race -count=1 ./...
      - name: test in other time zones
        run: |
          for tz in UTC America/Denver Pacific/Auckland Asia/Kolkata; do
            echo "TZ=$tz"
            TZ=$tz go test -count=1 ./...
          done
  gitleaks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: install gitleaks
        env:
          VERSION: 8.30.1
        run: |
          cd "$RUNNER_TEMP"
          base="https://github.com/gitleaks/gitleaks/releases/download/v${VERSION}"
          f="gitleaks_${VERSION}_linux_x64.tar.gz"
          curl -sSfL -o "$f" "$base/$f"
          curl -sSfL -o checksums.txt "$base/gitleaks_${VERSION}_checksums.txt"
          grep " $f\$" checksums.txt | sha256sum -c -
          tar -xzf "$f" gitleaks
          ./gitleaks version
      - name: scan history
        run: $RUNNER_TEMP/gitleaks git --redact --verbose --exit-code 1 .
      - name: scan working tree
        run: $RUNNER_TEMP/gitleaks dir --redact --verbose --exit-code 1 .
